name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3: '13.4', php: '8.2' }
          - { typo3: '13.4', php: '8.3' }
          - { typo3: '13.4', php: '8.4' }
          - { typo3: '13.4', php: '8.5' }
          - { typo3: '14.3', php: '8.2' }
          - { typo3: '14.3', php: '8.3' }
          - { typo3: '14.3', php: '8.4' }
          - { typo3: '14.3', php: '8.5' }

    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Pin TYPO3 version
        run: |
          composer require --no-update --no-interaction --no-progress \
            "typo3/cms-core:^${{ matrix.typo3 }}" \
            "typo3/cms-backend:^${{ matrix.typo3 }}" \
            "typo3/cms-workspaces:^${{ matrix.typo3 }}"
          composer require --no-update --no-interaction --no-progress --dev \
            "typo3/cms-install:^${{ matrix.typo3 }}"

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run functional test suite
        run: composer test
